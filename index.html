<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸루맘 상점</title>
<meta name="description" content="결제는 엄마가, 검수는 푸루가! @puruland_ 푸루랑 직접 써본 공구 & 추천템 모음">
<meta property="og:title" content="푸루맘 상점 🧸">
<meta property="og:description" content="결제는 엄마가, 검수는 푸루가 · 우리 집 실사용 합격템만 모았어요">
<meta property="og:image" content="%EA%B7%80%EC%97%AC%EC%9A%B4%20%ED%91%B8%EB%A3%A8%EB%A7%98%20%EC%95%84%EA%B8%B0%20%EC%97%84%EC%A7%80%EC%B2%99%20%EB%A1%9C%EA%B3%A0.png">
<link rel="icon" href="%EA%B7%80%EC%97%AC%EC%9A%B4%20%ED%91%B8%EB%A3%A8%EB%A7%98%20%EC%95%84%EA%B8%B0%20%EC%97%84%EC%A7%80%EC%B2%99%20%EB%A1%9C%EA%B3%A0.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#222;--pink:#FF6FA3;--yellow:#FFE14D;--cream:#FFF6D6}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Jua,sans-serif}
html{scroll-behavior:smooth}
.w{max-width:480px;margin:0 auto;padding-bottom:40px}
.topnote{text-align:center;font-size:11px;color:#777;margin:0;padding:7px 12px}
.face{display:inline-block;border-radius:50%;border:2.5px solid var(--ink);background:url("%EC%95%84%EA%B8%B0%20%ED%91%9C%EC%A0%95%209%EC%A2%85%20%EA%B0%90%EC%A0%95%20%EC%BD%9C%EB%9D%BC%EC%A3%BC%20-%20%EB%B3%B5%EC%82%AC%EB%B3%B8.png") 0 0/300% 300% no-repeat #fff;flex:none}
.f-laugh{background-position:0% 0%}.f-wow{background-position:50% 0%}.f-angry{background-position:100% 0%}.f-cry{background-position:0% 50%}.f-giggle{background-position:50% 50%}.f-curious{background-position:100% 50%}.f-clap{background-position:0% 100%}.f-sleep{background-position:50% 100%}.f-eat{background-position:100% 100%}
.hd{padding:14px 16px 10px;background:radial-gradient(#F5C800 1.3px,transparent 1.6px) 0 0/10px 10px,var(--yellow);border-bottom:3px solid var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between}
.top img{width:56px;height:56px;border-radius:50%}
.ep{font-size:12px;background:var(--ink);color:var(--yellow);padding:4px 10px;border-radius:6px}
h1{font-family:"Black Han Sans";font-weight:400;font-size:44px;background:#fff;border:3px solid var(--ink);display:inline-block;padding:2px 14px;margin:10px 0 6px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.sub{font-size:15px;margin-bottom:12px}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pn{border:3px solid var(--ink);background:#fff;position:relative;height:170px;overflow:hidden}
.pn .mom{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scaleX(-1);background:#DDEFFF}
.pn .ph{position:absolute;top:0;left:50%;height:100%;width:auto;aspect-ratio:1;transform:translateX(-50%);border:0;border-radius:0}
.pn .t{position:absolute;left:5px;right:5px;background:#fff;border:2px solid var(--ink);border-radius:12px;font-size:12px;padding:3px 6px;line-height:1.2;text-align:center;z-index:2}
.pn .n{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:#fff;font-size:11px;text-align:center;padding:2px;z-index:2}
.pn.win{background:repeating-conic-gradient(from 0deg at 50% 60%,var(--pink) 0 10deg,#fff 10deg 20deg)}
.pn.win .face{position:absolute;left:8%;top:34px;width:84%;aspect-ratio:1;border-width:3px}
.pn.win .t{top:5px;background:var(--pink);color:#fff;font-family:"Black Han Sans";font-size:19px}
.faces{display:flex;gap:6px;margin:12px 0 2px;align-items:center;font-size:13px;flex-wrap:wrap}.faces .face{width:34px;height:34px;border-width:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:12px 16px 6px}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:9px 16px;font-size:15px}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0;color:var(--ink)}
.chips{display:flex;gap:6px;margin-top:8px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--ink);background:#fff;padding:5px 12px;font:inherit;font-size:14px;border-radius:99px;color:var(--ink);cursor:pointer}.chips button.on{background:var(--ink);color:var(--yellow)}
main{padding:0 16px}
.sec{font-family:"Black Han Sans";font-size:22px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}.sec .face{width:40px;height:40px}
.card{display:grid;grid-template-columns:112px 1fr;gap:12px;border:3px solid var(--ink);background:#fff;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink);border-radius:14px;padding:12px;position:relative}
a.card{text-decoration:none;color:inherit;scroll-margin-top:130px}
a.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.card .ph{border-radius:10px;background:#FFF1A8;display:grid;place-items:center;font-size:44px;min-height:130px;overflow:hidden}
.card .ph img{width:100%;display:block}
.card .in{min-width:0}
.card .nar{display:inline-block;background:var(--yellow);font-size:11px;padding:2px 8px;border-radius:99px}
.nar.hot{background:#ff3b5c!important;color:#fff}
.card h3{font-family:"Black Han Sans";font-weight:400;font-size:18px;margin:6px 0 4px;line-height:1.25}
.card .say{background:#FFF1A8;border-radius:12px;padding:6px 9px;font-family:"Nanum Pen Script";font-size:19px;line-height:1.1;margin:6px 0 8px}
.card .pr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.card .pr b{font-family:"Black Han Sans";font-weight:400;font-size:18px;color:var(--pink)}.card .pr s{font-size:12px;color:#888}
.go{display:inline-block;background:var(--pink);color:#fff;border-radius:99px;padding:6px 14px;font-size:14px}
.ad{display:block;font-size:10px;color:#777;margin-top:6px}
.stk{position:absolute;left:78px;top:-12px;width:50px;height:50px;border:3px solid #fff;box-shadow:0 2px 6px #0003;transform:rotate(8deg)}
.stk2{position:absolute;left:6px;top:128px;background:var(--ink);color:var(--yellow);font-size:12px;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.card.closed{filter:grayscale(.8);opacity:.6}
.card.hit{animation:hit 1.4s steps(2) 2}@keyframes hit{50%{box-shadow:4px 4px 0 var(--pink);border-color:var(--pink)}}
.empty{border:3px dashed var(--ink);background:#fff;text-align:center;padding:16px;font-size:14px;border-radius:14px}
.end{text-align:center;margin:28px 16px 0;font-family:"Black Han Sans";font-size:22px}
.end small{display:block;font-family:Jua;font-size:13px;color:#555;margin-top:4px}
.note{font-size:10px;color:#777;margin-top:10px;line-height:1.6;font-family:Jua}.note p{margin:3px 0}
</style>
</head>
<body>
<div class="w">
<p class="topnote">이 페이지에는 쿠팡·네이버 제휴 링크가 있어 구매 시 수수료를 받을 수 있어요.</p>
<header class="hd">
 <div class="top"><span class="ep">EP.2 푸루의 검수 일지</span><a href="https://www.instagram.com/puruland_/" target="_blank" rel="noopener"><img src="%EA%B7%80%EC%97%AC%EC%9A%B4%20%ED%91%B8%EB%A3%A8%EB%A7%98%20%EC%95%84%EA%B8%B0%20%EC%97%84%EC%A7%80%EC%B2%99%20%EB%A1%9C%EA%B3%A0.png" alt="purumom"></a></div>
 <h1>푸루맘 상점</h1><div class="sub">엄마가 고르고, 푸루가 표정으로 심사했어요</div>
 <div class="strip">
  <div class="pn"><img class="mom" src="%ED%8C%8C%EB%9E%80%20%EB%8B%88%ED%8A%B8%20%EC%A1%B0%EB%81%BC%EB%A5%BC%20%EC%9E%85%EC%9D%80%20%EC%97%AC%EC%84%B1%20%EC%B4%88%EC%83%81.png" alt="푸루맘"><div class="t" style="bottom:24px">푸루야~ 이거 써볼까?</div><div class="n">푸루맘</div></div>
  <div class="pn"><span class="face f-curious ph"></span><div class="t" style="top:5px">흐음… 검수 중</div><div class="n">푸루</div></div>
  <div class="pn win"><div class="t">합격!!</div><span class="face f-clap"></span></div>
 </div>
 <div class="faces">오늘의 심사위원 표정 <span class="face f-laugh"></span><span class="face f-wow"></span><span class="face f-giggle"></span><span class="face f-eat"></span><span class="face f-sleep"></span></div>
</header>
<div class="bar"><label class="search">🔍<input id="q" type="search" placeholder="상품 이름으로 찾기"></label><div class="chips" id="chips"></div></div>
<main id="list"></main>
<div class="end">다음 화에 계속…<small>새 에피소드는 인스타 @puruland_ 에서 제일 먼저!</small><div class="note" id="disc"></div></div>
</div>
<script src="products.js"></script>
<script>
(function(){
  var P = (window.PRODUCTS || []).slice();
  var today = new Date(); today.setHours(0,0,0,0);
  function day(s){ return new Date(s + 'T00:00:00'); }
  function diff(s){ return Math.round((day(s) - today) / 864e5); }
  function state(p){
    if (p.type !== '공구') return 'pick';
    if (p.closed || (p.end && diff(p.end) < 0)) return 'closed';
    if (p.start && diff(p.start) > 0) return 'soon';
    return 'open';
  }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var DISC = {
    coupang: {name: '쿠팡', short: '쿠팡 인플루언서 링크 · 수수료를 받아요', full: '이 포스팅은 쿠팡 인플루언서 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.'},
    naver: {name: '네이버', short: '네이버 브랜드커넥트 링크 · 수수료를 받아요', full: '※이 포스팅에 있는 일부 상품은 네이버 브랜드커넥트(쇼핑커넥트) 활동의 일환으로, 판매 발생 시 수수료를 제공받습니다.'}
  };
  function nar(p){
    var s = state(p), bits = [];
    if (s === 'open') { if (p.end) { var m = diff(p.end); bits.push(m <= 0 ? '오늘 마감!' : m === 1 ? '내일 마감!' : '마감 D-' + m); } else bits.push('공구 진행 중'); }
    else if (s === 'soon') { var n = diff(p.start); bits.push('오픈 ' + (n <= 0 ? '오늘' : 'D-' + n)); }
    else if (s === 'closed') bits.push('마감');
    if (p.category) bits.push(p.category);
    if (DISC[p.partner]) bits.push(DISC[p.partner].name);
    var hot = s === 'open' && p.end && diff(p.end) <= 1;
    return '<span class="nar' + (hot ? ' hot' : '') + '">' + esc(bits.join(' · ')) + '</span>';
  }
  function card(p){
    var s = state(p);
    var ph = p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + esc(p.emoji || '🎁') + '\'">' : esc(p.emoji || '🎁');
    var go = s === 'open' ? '공구 참여하기 ▶' : s === 'soon' ? (p.start.slice(5).replace('-', '/') + ' 오픈 예정') : s === 'closed' ? '마감됐어요' : '보러 가기 ▶';
    var price = (p.sale ? '<b>' + esc(p.sale) + '</b>' : '') + (p.price ? '<s>' + esc(p.price) + '</s>' : '');
    var href = (s === 'open' || s === 'pick') ? esc(p.link) : '#' + esc(p.id);
    var ext = (s === 'open' || s === 'pick') ? ' target="_blank" rel="noopener"' : '';
    return '<a class="card' + (s === 'closed' ? ' closed' : '') + '" id="' + esc(p.id) + '" href="' + href + '"' + ext + '>' +
      (s === 'pick' ? '<span class="face f-laugh stk"></span><span class="stk2">푸루 합격!</span>' : '') + '<div class="ph">' + ph + '</div><div class="in">' + nar(p) + '<h3>' + esc(p.name) + '</h3>' +
      (price ? '<div class="pr">' + price + '</div>' : '') + (p.note ? '<div class="say">' + esc(p.note) + '</div>' : '') +
      '<span class="go">' + go + '</span>' + (DISC[p.partner] ? '<span class="ad">' + DISC[p.partner].short + '</span>' : '') + '</div></a>';
  }
  var used = {}; P.forEach(function(p){ if (DISC[p.partner]) used[p.partner] = 1; });
  document.getElementById('disc').innerHTML = Object.keys(used).map(function(k){ return '<p>' + DISC[k].full + '</p>'; }).join('');
  var cats = [];
  P.forEach(function(p){ if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
  var chipList = ['전체', '🔥 공구', '💛 추천템'].concat(cats);
  var cur = '전체';
  var chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = chipList.map(function(c, i){ return '<button' + (i === 0 ? ' class="on"' : '') + '>' + esc(c) + '</button>'; }).join('');
  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var items = P.filter(function(p){
      if (cur === '🔥 공구' && p.type !== '공구') return false;
      if (cur === '💛 추천템' && p.type === '공구') return false;
      if (cats.indexOf(cur) >= 0 && p.category !== cur) return false;
      if (q && (p.name + ' ' + (p.note || '') + ' ' + (p.category || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var open = items.filter(function(p){ return state(p) === 'open'; }).sort(function(a,b){ return (a.end || '9999').localeCompare(b.end || '9999'); });
    var soon = items.filter(function(p){ return state(p) === 'soon'; }).sort(function(a,b){ return a.start.localeCompare(b.start); });
    var pick = items.filter(function(p){ return state(p) === 'pick'; });
    var closed = items.filter(function(p){ return state(p) === 'closed'; });
    var h = '';
    if (open.length || cur === '전체' || cur === '🔥 공구') h += '<div class="sec"><span class="face f-wow"></span>진행 중인 공구</div>' + (open.length ? open.map(card).join('') : '<div class="empty">다음 화에 새 공구가 찾아와요! 🧸</div>');
    if (soon.length) h += '<div class="sec"><span class="face f-curious"></span>오픈 예정 공구</div>' + soon.map(card).join('');
    if (pick.length) h += '<div class="sec"><span class="face f-clap"></span>푸루 합격템</div>' + pick.map(card).join('');
    if (closed.length) h += '<div class="sec"><span class="face f-sleep"></span>지난 에피소드</div>' + closed.map(card).join('');
    if (!items.length) h = '<div class="empty" style="margin-top:20px">찾는 상품이 없어요 🥲</div>';
    document.getElementById('list').innerHTML = h;
  }
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cur = b.textContent; [].forEach.call(chipsEl.children, function(x){ x.classList.toggle('on', x === b); }); render();
  });
  document.getElementById('q').addEventListener('input', render);
  render();
  function jump(){
    var id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
    var el = document.getElementById(id);
    if (!el) { cur = '전체'; document.getElementById('q').value = ''; render(); el = document.getElementById(id); }
    if (!el) return;
    setTimeout(function(){ el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }, 250);
  }
  window.addEventListener('hashchange', jump); jump();
})();
</script>
</body>
</html>
