<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸루맘 상점</title>
<meta name="description" content="@puruland_ 푸루맘이 푸루랑 직접 써본 공구 & 추천템 모음">
<meta property="og:title" content="푸루맘 상점 🧸">
<meta property="og:description" content="푸루랑 직접 써본 것만 모았어요 · 공구 & 추천템">
<meta property="og:image" content="book_art.jpg">
<link rel="icon" href="profile.png">
<style>
@font-face{font-family:Galmuri11;src:url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2) format("woff2")}
@font-face{font-family:Galmuri11;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2) format("woff2")}
:root{--bg:#fff3e0;--ink:#3b2a4a;--pink:#ff7aa2;--mint:#7fd6b4;--sky:#8cc4ff;--yellow:#ffd55a;--lav:#b9a3ff;--peach:#ffb38a;--red:#ff4d6d;--paper:#fffdf6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:Galmuri11,monospace;font-weight:700;background:var(--bg);
background-image:linear-gradient(rgba(59,42,74,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(59,42,74,.06) 2px,transparent 2px);background-size:16px 16px;-webkit-font-smoothing:none}
.w{max-width:480px;margin:0 auto;padding:0 14px 48px}
.px{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.hero2{position:relative;margin:14px 0 0;padding:6px;background:var(--ink)}
.hero2 img{display:block;width:100%;image-rendering:auto}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;font-size:12px;padding:6px 8px 2px;letter-spacing:.5px}
.hud .hp{display:flex;gap:3px}.hud .hp i{width:12px;height:11px;background:var(--pink);clip-path:polygon(25% 0,50% 20%,75% 0,100% 25%,100% 50%,50% 100%,0 50%,0 25%)}
.hud a{color:var(--yellow);text-decoration:none}
.start{display:block;text-align:center;margin:10px 0 0;font-size:13px;color:var(--ink);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -14px;padding:12px 14px 8px}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px}
.search input{border:0;outline:0;flex:1;font:inherit;color:var(--ink);background:transparent;min-width:0}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 6px 0}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--yellow)}
.chips button.on:before{content:"▶ "}
.topnote{text-align:center;font-size:11px;color:#7a6a86;margin:8px 0 0}
.lbl{display:table;margin:24px auto 14px;font-weight:700;font-size:16px;background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 14px}
.lbl.g{background:var(--mint);color:var(--ink)}.lbl.x{background:#c9bfd0;color:var(--ink)}
a.card{display:flex;gap:12px;padding:10px;margin-bottom:16px;text-decoration:none;color:inherit;scroll-margin-top:130px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--paper);position:relative}
a.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.card.closed{filter:grayscale(.8);opacity:.6}
.ph{width:96px;height:96px;flex:none;border:3px solid var(--ink);display:grid;place-items:center;font-size:44px;overflow:hidden;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover}
.peach .ph{background:var(--peach)}.mint .ph{background:var(--mint)}.sky .ph{background:var(--sky)}.yellow .ph{background:var(--yellow)}.lav .ph{background:var(--lav)}
.in{flex:1;min-width:0}
.bd{display:flex;gap:5px;flex-wrap:wrap}
.tg{font-size:11px;padding:1px 6px;border:2px solid var(--ink);background:#fff}
.tg.hot{background:var(--red);color:#fff;animation:blink 1s steps(1) infinite}
.card h3{font-weight:700;font-size:16px;line-height:1.35;margin:6px 0 2px}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pr b{font-weight:700;font-size:16px;color:#e0446a}.pr s{font-size:11px;color:#8a7a96}
.card small{display:block;font-size:12px;line-height:1.45;opacity:.85;margin-top:2px}
.go{display:inline-block;margin-top:8px;font-size:13px;background:var(--ink);color:#fff;padding:5px 10px}
.go:before{content:"▶ ";color:var(--yellow)}
.ad{display:block;font-size:10px;opacity:.65;margin-top:6px}
.card.hit{animation:hit 1.4s steps(2) 2}
@keyframes hit{50%{box-shadow:5px 5px 0 var(--pink);border-color:var(--pink)}}
.empty{text-align:center;font-size:13px;line-height:1.6;padding:18px;border:3px dashed var(--ink);background:var(--paper)}
footer{text-align:center;font-size:12px;margin-top:30px;line-height:1.7}
footer img{height:100px;display:block;margin:0 auto 4px}
footer a{color:#e0446a;text-decoration:none;font-weight:700}
.note{font-size:10px;color:#7a6a86;margin-top:12px;line-height:1.6}.note p{margin:4px 0}
.save{display:inline-block;margin-top:6px;font-size:11px;background:var(--ink);color:var(--yellow);padding:3px 8px}
</style>
</head>
<body>
<div class="w">
  <div class="hero2 px">
    <div class="hud"><span>PLAYER 1 · PURU</span><span class="hp"><i></i><i></i><i></i></span><a href="https://www.instagram.com/puruland_/" target="_blank" rel="noopener">@puruland_</a></div>
    <img src="PURULAND%20_%20%EC%95%84%EA%B8%B0%EB%B0%A9%EA%BE%B8%EB%AF%B8%EA%B8%B0%20%EC%BA%94%EB%B0%941%20%EC%86%90%EA%B8%80%EC%94%A8%20%ED%86%B5%EC%9D%BC%20%EC%88%98%EC%A0%95%EB%B3%B8%209%EC%9E%A5%20%28%EC%9D%B8%EC%8A%A4%ED%83%80%EA%B7%B8%EB%9E%A8%20%EA%B2%8C%EC%8B%9C%EB%AC%BC%284_5%29%29%EC%9D%98%20%EC%82%AC%EB%B3%B8.png" alt="푸루 추천템 PURU&#39;S ITEM · 결제는 엄마가, 검수는 푸루가">
  </div>
  <span class="start">▶ PRESS START · 아이템을 골라주세요</span>
  <div class="bar">
    <label class="search px">🔍<input id="q" type="search" placeholder="찾는 육아템이 있나요?"></label>
    <div class="chips" id="chips"></div>
  </div>
  <p class="topnote">이 페이지에는 쿠팡·네이버 제휴 링크가 있어 구매 시 수수료를 받을 수 있어요.</p>
  <main id="list"></main>
  <footer>
    <img src="puru_jacket.png" alt="">
    NEXT STAGE · 새 공구 소식은 인스타에서 제일 먼저!<br>
    <a href="https://www.instagram.com/puruland_/" target="_blank" rel="noopener">@puruland_</a><br><span class="save">♥ SAVE COMPLETE · 또 놀러 오세요</span>
    <div class="note" id="disc"></div>
  </footer>
</div>
<script src="products.js"></script>
<script>
(function(){
  var P = (window.PRODUCTS || []).slice();
  var today = new Date(); today.setHours(0,0,0,0);
  function day(s){ return new Date(s + 'T00:00:00'); }
  function diff(s){ return Math.round((day(s) - today) / 864e5); }
  function state(p){
    if (p.type !== '공구') return 'pick';
    if (p.closed || (p.end && diff(p.end) < 0)) return 'closed';
    if (p.start && diff(p.start) > 0) return 'soon';
    return 'open';
  }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function badge(p){
    var s = state(p);
    if (s === 'pick') return '<span class="tg">' + esc(p.category || '추천템') + '</span>';
    if (s === 'closed') return '<span class="tg">마감</span>';
    if (s === 'soon') { var n = diff(p.start); return '<span class="tg">오픈 ' + (n <= 0 ? '오늘' : 'D-' + n) + '</span>'; }
    if (!p.end) return '<span class="tg">공구 진행 중</span>';
    var m = diff(p.end);
    return '<span class="tg' + (m <= 1 ? ' hot' : '') + '">' + (m <= 0 ? '오늘 마감!' : m === 1 ? '내일 마감!' : '마감 D-' + m) + '</span>';
  }
  function card(p){
    var s = state(p);
    var ph = p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + esc(p.emoji || '🎁') + '\'">' : esc(p.emoji || '🎁');
    var go = s === 'open' ? '공구 참여하기' : s === 'soon' ? (p.start.slice(5).replace('-', '/') + ' 오픈 예정') : s === 'closed' ? '마감됐어요' : '보러 가기';
    var price = (p.sale ? '<b>' + esc(p.sale) + '</b>' : '') + (p.price ? '<s>' + esc(p.price) + '</s>' : '');
    var href = (s === 'open' || s === 'pick') ? esc(p.link) : '#' + esc(p.id);
    var ext = (s === 'open' || s === 'pick') ? ' target="_blank" rel="noopener"' : '';
    return '<a class="card ' + esc(p.color || 'peach') + (s === 'closed' ? ' closed' : '') + '" id="' + esc(p.id) + '" href="' + href + '"' + ext + '>' +
      '<div class="ph">' + ph + '</div><div class="in"><div class="bd">' + badge(p) +
      (p.type === '공구' && p.category ? '<span class="tg">' + esc(p.category) + '</span>' : '') + '</div>' +
      '<h3>' + esc(p.name) + '</h3>' + (price ? '<div class="pr">' + price + '</div>' : '') +
      (p.note ? '<small>' + esc(p.note) + '</small>' : '') + '<span class="go">' + go + '</span>' +
      (DISC[p.partner] ? '<span class="ad">' + DISC[p.partner].short + '</span>' : '') + '</div></a>';
  }
  var DISC = {
    coupang: {short: '쿠팡 인플루언서 링크 · 수수료를 받아요', full: '이 포스팅은 쿠팡 인플루언서 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.'},
    naver: {short: '네이버 브랜드커넥트 링크 · 수수료를 받아요', full: '※이 포스팅에 있는 일부 상품은 네이버 브랜드커넥트(쇼핑커넥트) 활동의 일환으로, 판매 발생 시 수수료를 제공받습니다.'}
  };
  var used = {}; P.forEach(function(p){ if (DISC[p.partner]) used[p.partner] = 1; });
  document.getElementById('disc').innerHTML = Object.keys(used).map(function(k){ return '<p>' + DISC[k].full + '</p>'; }).join('');
  var cats = [];
  P.forEach(function(p){ if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
  var chipList = ['전체', '🔥 공구', '💛 추천템'].concat(cats);
  var cur = '전체';
  var chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = chipList.map(function(c, i){ return '<button' + (i === 0 ? ' class="on"' : '') + '>' + esc(c) + '</button>'; }).join('');
  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var items = P.filter(function(p){
      if (cur === '🔥 공구' && p.type !== '공구') return false;
      if (cur === '💛 추천템' && p.type === '공구') return false;
      if (cats.indexOf(cur) >= 0 && p.category !== cur) return false;
      if (q && (p.name + ' ' + (p.note || '') + ' ' + (p.category || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var open = items.filter(function(p){ return state(p) === 'open'; }).sort(function(a,b){ return (a.end || '9999').localeCompare(b.end || '9999'); });
    var soon = items.filter(function(p){ return state(p) === 'soon'; }).sort(function(a,b){ return a.start.localeCompare(b.start); });
    var pick = items.filter(function(p){ return state(p) === 'pick'; });
    var closed = items.filter(function(p){ return state(p) === 'closed'; });
    var h = '';
    if (open.length || cur === '전체' || cur === '🔥 공구') h += '<span class="lbl">🔥 진행 중인 공구</span>' + (open.length ? open.map(card).join('') : '<div class="empty">지금 진행 중인 공구가 없어요.<br>곧 새 공구로 찾아올게요 🧸</div>');
    if (soon.length) h += '<span class="lbl">⏰ 오픈 예정 공구</span>' + soon.map(card).join('');
    if (pick.length) h += '<span class="lbl g">💛 푸루맘 추천템</span>' + pick.map(card).join('');
    if (closed.length) h += '<span class="lbl x">📦 지난 공구</span>' + closed.map(card).join('');
    if (!items.length) h = '<div class="empty" style="margin-top:20px">찾는 상품이 없어요 🥲</div>';
    document.getElementById('list').innerHTML = h;
  }
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cur = b.textContent; [].forEach.call(chipsEl.children, function(x){ x.classList.toggle('on', x === b); }); render();
  });
  document.getElementById('q').addEventListener('input', render);
  render();
  function jump(){
    var id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
    var el = document.getElementById(id);
    if (!el) { cur = '전체'; document.getElementById('q').value = ''; render(); el = document.getElementById(id); }
    if (!el) return;
    setTimeout(function(){ el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }, 250);
  }
  window.addEventListener('hashchange', jump); jump();
})();
</script>
</body>
</html>
