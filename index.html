<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸루맘 상점</title>
<meta name="description" content="결제는 엄마가, 검수는 푸루가! @puruland_ 푸루랑 직접 써본 공구 & 추천템 모음">
<meta property="og:title" content="푸루맘 상점 🧸">
<meta property="og:description" content="결제는 엄마가, 검수는 푸루가 · 우리 집 실사용 합격템만 모았어요">
<meta property="og:image" content="puru_up.png">
<link rel="icon" href="profile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1d1f;--paper:#fffdf8;--pink:#ff6f9c;--yellow:#ffe14d;--sky:#7ec8ff;--mint:#6fdcb0}
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:var(--ink);font-family:Jua,sans-serif}
.w{max-width:480px;margin:0 auto;padding:12px 12px 40px}
.page{background:var(--paper);border:3px solid var(--ink);padding:10px;border-radius:6px}
.title{position:relative;text-align:center;padding:16px 8px 12px;border:3px solid var(--ink);margin-bottom:8px;
background:radial-gradient(circle,#ffd1e0 1.6px,transparent 1.8px) 0 0/10px 10px,var(--yellow)}
.title h1{font-family:"Black Han Sans";font-size:46px;margin:0;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);letter-spacing:1px}
.title .ep{display:inline-block;background:var(--ink);color:#fff;font-size:13px;padding:3px 10px;transform:rotate(-2deg)}
.title .sub{font-family:"Nanum Pen Script";font-size:24px;margin-top:2px}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pn{position:relative;border:3px solid var(--ink);height:190px;overflow:hidden;background:#fff}
.pn img{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);height:150px}
.pn.a{background:radial-gradient(circle,#cfe8ff 1.5px,transparent 1.7px) 0 0/9px 9px,#fff}
.pn.b{background:repeating-linear-gradient(45deg,#fff 0 8px,#fff3c4 8px 16px)}
.pn.c{background:repeating-conic-gradient(from 0deg at 50% 70%,#ffe14d 0 10deg,#fff 10deg 20deg)}
.bb{position:absolute;top:8px;left:6px;right:6px;background:#fff;border:2.5px solid var(--ink);border-radius:50%;padding:7px 4px;font-size:13px;text-align:center;line-height:1.2;z-index:2}
.bb:after{content:"";position:absolute;left:46%;bottom:-11px;border:6px solid transparent;border-top:8px solid var(--ink)}
.boom{position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-8deg);white-space:nowrap;font-family:"Black Han Sans";font-size:24px;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);z-index:2}
.fx{position:absolute;font-family:"Black Han Sans";font-size:16px;color:var(--ink);z-index:2}
.hero{border:3px solid var(--ink);margin-top:8px;position:relative}
.hero img{display:block;width:100%}
.hero .tag{position:absolute;right:8px;bottom:8px;background:#fff;border:2.5px solid var(--ink);padding:4px 10px;font-size:13px;border-radius:14px}
.bar{position:sticky;top:0;z-index:5;background:#f4f1ea;padding:10px 0 6px}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:8px 14px;font-size:15px}
.chips{display:flex;gap:6px;margin-top:8px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2.5px solid var(--ink);background:#fff;padding:5px 12px;font:inherit;font-size:14px;border-radius:16px;color:var(--ink);cursor:pointer}.chips button.on{background:var(--ink);color:#fff}
.sec{font-family:"Black Han Sans";font-size:24px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:12px;height:24px;background:var(--pink);border:2px solid var(--ink)}
.card{display:grid;grid-template-columns:120px 1fr;border:3px solid var(--ink);background:#fff;margin-bottom:14px;box-shadow:6px 6px 0 var(--ink)}
.card .ph{border-right:3px solid var(--ink);background:radial-gradient(circle,#ffe9a8 1.6px,transparent 1.8px) 0 0/9px 9px,#fff7d6;display:grid;place-items:center;padding:8px;font-size:46px}
.card .ph img{width:100%}
.card .in{padding:10px 12px;position:relative}
.card .nar{display:inline-block;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px}
.nar.hot{background:#ff3b5c}
.card h3{font-family:"Black Han Sans";font-weight:400;font-size:19px;margin:6px 0 4px;line-height:1.25}
.card .pr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.card .pr b{font-family:"Black Han Sans";font-weight:400;font-size:18px;color:var(--pink)}.card .pr s{font-size:12px;color:#888}
.card .say{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:6px 10px;font-family:"Nanum Pen Script";font-size:21px;line-height:1.1;margin:6px 0}
.card .say:before{content:"";position:absolute;left:-12px;top:12px;border:6px solid transparent;border-right:9px solid var(--ink)}
.go{display:inline-block;background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:5px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.ad{display:block;font-size:10px;color:#777;margin-top:6px}
.empty{border:3px dashed var(--ink);background:#fff;text-align:center;padding:16px;font-size:14px}
.end{text-align:center;margin-top:24px;font-family:"Black Han Sans";font-size:22px}
.end small{display:block;font-family:Jua;font-size:13px;color:#555;margin-top:4px}
html{scroll-behavior:smooth}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0;color:var(--ink)}
a.card{text-decoration:none;color:inherit;scroll-margin-top:130px}
a.card:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.card.closed{filter:grayscale(.8);opacity:.6}
.card.hit{animation:hit 1.4s steps(2) 2}@keyframes hit{50%{box-shadow:6px 6px 0 var(--pink);border-color:var(--pink)}}
.topnote{text-align:center;font-size:11px;color:#777;margin:8px 0 0}
.note{font-size:10px;color:#777;margin-top:10px;line-height:1.6;font-family:Jua}.note p{margin:3px 0}
</style>
</head>
<body>
<div class="w">
<div class="page">
 <div class="title"><span class="ep">EP.1 결제는 엄마가, 검수는 푸루가</span><h1>푸루맘 상점</h1><div class="sub">우리 집 실사용 합격템만 모았어요</div></div>
 <div class="strip">
  <div class="pn a"><div class="bb">푸루야~<br>이거 써볼까?</div><img src="mom.png" alt="" onerror="this.style.display='none'"></div>
  <div class="pn b"><div class="bb">흐음...<br>검수 중</div><span class="fx" style="right:8px;bottom:60px">꼼꼼</span><img src="puru_white.png" alt="" style="height:135px"></div>
  <div class="pn c"><div class="boom">합격!!</div><img src="puru_up.png" alt="" style="height:150px"></div>
 </div>
 <div class="hero"><img src="PURULAND%20_%20%EC%95%84%EA%B8%B0%EB%B0%A9%EA%BE%B8%EB%AF%B8%EA%B8%B0%20%EC%BA%94%EB%B0%941%20%EC%86%90%EA%B8%80%EC%94%A8%20%ED%86%B5%EC%9D%BC%20%EC%88%98%EC%A0%95%EB%B3%B8%209%EC%9E%A5%20%28%EC%9D%B8%EC%8A%A4%ED%83%80%EA%B7%B8%EB%9E%A8%20%EA%B2%8C%EC%8B%9C%EB%AC%BC%284_5%29%29%EC%9D%98%20%EC%82%AC%EB%B3%B8.png" alt="푸루 추천템 PURU&#39;S ITEM"><a class="tag" href="https://www.instagram.com/puruland_/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">@puruland_</a></div>
</div>
<div class="bar"><label class="search">🔍<input id="q" type="search" placeholder="찾는 육아템이 있나요?"></label><div class="chips" id="chips"></div></div>
<p class="topnote">이 페이지에는 쿠팡·네이버 제휴 링크가 있어 구매 시 수수료를 받을 수 있어요.</p>
<main id="list"></main>
<div class="end">다음 화에 계속…<small>새 에피소드는 인스타 @puruland_ 에서 제일 먼저!</small><div class="note" id="disc"></div></div>
</div>
<script src="products.js"></script>
<script>
(function(){
  var P = (window.PRODUCTS || []).slice();
  var today = new Date(); today.setHours(0,0,0,0);
  function day(s){ return new Date(s + 'T00:00:00'); }
  function diff(s){ return Math.round((day(s) - today) / 864e5); }
  function state(p){
    if (p.type !== '공구') return 'pick';
    if (p.closed || (p.end && diff(p.end) < 0)) return 'closed';
    if (p.start && diff(p.start) > 0) return 'soon';
    return 'open';
  }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var DISC = {
    coupang: {name: '쿠팡', short: '쿠팡 인플루언서 링크 · 수수료를 받아요', full: '이 포스팅은 쿠팡 인플루언서 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.'},
    naver: {name: '네이버', short: '네이버 브랜드커넥트 링크 · 수수료를 받아요', full: '※이 포스팅에 있는 일부 상품은 네이버 브랜드커넥트(쇼핑커넥트) 활동의 일환으로, 판매 발생 시 수수료를 제공받습니다.'}
  };
  function nar(p){
    var s = state(p), bits = [];
    if (s === 'open') { if (p.end) { var m = diff(p.end); bits.push(m <= 0 ? '오늘 마감!' : m === 1 ? '내일 마감!' : '마감 D-' + m); } else bits.push('공구 진행 중'); }
    else if (s === 'soon') { var n = diff(p.start); bits.push('오픈 ' + (n <= 0 ? '오늘' : 'D-' + n)); }
    else if (s === 'closed') bits.push('마감');
    if (p.category) bits.push(p.category);
    if (DISC[p.partner]) bits.push(DISC[p.partner].name);
    var hot = s === 'open' && p.end && diff(p.end) <= 1;
    return '<span class="nar' + (hot ? ' hot' : '') + '">' + esc(bits.join(' · ')) + '</span>';
  }
  function card(p){
    var s = state(p);
    var ph = p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy" onerror="this.parentNode.textContent=\'' + esc(p.emoji || '🎁') + '\'">' : esc(p.emoji || '🎁');
    var go = s === 'open' ? '공구 참여하기 ▶' : s === 'soon' ? (p.start.slice(5).replace('-', '/') + ' 오픈 예정') : s === 'closed' ? '마감됐어요' : '보러 가기 ▶';
    var price = (p.sale ? '<b>' + esc(p.sale) + '</b>' : '') + (p.price ? '<s>' + esc(p.price) + '</s>' : '');
    var href = (s === 'open' || s === 'pick') ? esc(p.link) : '#' + esc(p.id);
    var ext = (s === 'open' || s === 'pick') ? ' target="_blank" rel="noopener"' : '';
    return '<a class="card' + (s === 'closed' ? ' closed' : '') + '" id="' + esc(p.id) + '" href="' + href + '"' + ext + '>' +
      '<div class="ph">' + ph + '</div><div class="in">' + nar(p) + '<h3>' + esc(p.name) + '</h3>' +
      (price ? '<div class="pr">' + price + '</div>' : '') + (p.note ? '<div class="say">' + esc(p.note) + '</div>' : '') +
      '<span class="go">' + go + '</span>' + (DISC[p.partner] ? '<span class="ad">' + DISC[p.partner].short + '</span>' : '') + '</div></a>';
  }
  var used = {}; P.forEach(function(p){ if (DISC[p.partner]) used[p.partner] = 1; });
  document.getElementById('disc').innerHTML = Object.keys(used).map(function(k){ return '<p>' + DISC[k].full + '</p>'; }).join('');
  var cats = [];
  P.forEach(function(p){ if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
  var chipList = ['전체', '🔥 공구', '💛 추천템'].concat(cats);
  var cur = '전체';
  var chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = chipList.map(function(c, i){ return '<button' + (i === 0 ? ' class="on"' : '') + '>' + esc(c) + '</button>'; }).join('');
  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var items = P.filter(function(p){
      if (cur === '🔥 공구' && p.type !== '공구') return false;
      if (cur === '💛 추천템' && p.type === '공구') return false;
      if (cats.indexOf(cur) >= 0 && p.category !== cur) return false;
      if (q && (p.name + ' ' + (p.note || '') + ' ' + (p.category || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var open = items.filter(function(p){ return state(p) === 'open'; }).sort(function(a,b){ return (a.end || '9999').localeCompare(b.end || '9999'); });
    var soon = items.filter(function(p){ return state(p) === 'soon'; }).sort(function(a,b){ return a.start.localeCompare(b.start); });
    var pick = items.filter(function(p){ return state(p) === 'pick'; });
    var closed = items.filter(function(p){ return state(p) === 'closed'; });
    var h = '';
    if (open.length || cur === '전체' || cur === '🔥 공구') h += '<div class="sec">진행 중인 공구</div>' + (open.length ? open.map(card).join('') : '<div class="empty">다음 화에 새 공구가 찾아와요! 🧸</div>');
    if (soon.length) h += '<div class="sec">오픈 예정 공구</div>' + soon.map(card).join('');
    if (pick.length) h += '<div class="sec">푸루 합격템</div>' + pick.map(card).join('');
    if (closed.length) h += '<div class="sec">지난 에피소드</div>' + closed.map(card).join('');
    if (!items.length) h = '<div class="empty" style="margin-top:20px">찾는 상품이 없어요 🥲</div>';
    document.getElementById('list').innerHTML = h;
  }
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cur = b.textContent; [].forEach.call(chipsEl.children, function(x){ x.classList.toggle('on', x === b); }); render();
  });
  document.getElementById('q').addEventListener('input', render);
  render();
  function jump(){
    var id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
    var el = document.getElementById(id);
    if (!el) { cur = '전체'; document.getElementById('q').value = ''; render(); el = document.getElementById(id); }
    if (!el) return;
    setTimeout(function(){ el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }, 250);
  }
  window.addEventListener('hashchange', jump); jump();
})();
</script>
</body>
</html>
